# Dokploy service "backend": Build Type = Nixpacks, Base Directory = /backend
#
# Lean builds: Nixpacks adds postgresql_16.dev + gcc when requirements mention psycopg2, but psycopg2-binary (and every other
# dependency here) ships prebuilt wheels, so only Python is needed. Fewer Nix packages = a much smaller download per build.
[variables]
NIXPACKS_PYTHON_VERSION = "3.12"
PIP_DISABLE_PIP_VERSION_CHECK = "1"

[phases.setup]
nixPkgs = ["python312"]
nixLibs = []
aptPkgs = []

[phases.install]
cmds = ["python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install --prefer-binary -r requirements.txt"]
cacheDirectories = ["/root/.cache/pip"]   # wheels survive between deploys

[start]
cmd = "uvicorn Main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers --forwarded-allow-ips='*'"
