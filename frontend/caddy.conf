{
	admin off
}

:{$PORT:3000} {
	root * dist
	encode zstd gzip

	# API + SSE streams (agent, studio) -> backend service. flush_interval -1 = no buffering.
	handle /api/* {
		reverse_proxy {$BACKEND_URL:http://127.0.0.1:8000} {
			flush_interval -1
		}
	}

	# OAuth discovery for MCP clients (Claude, ChatGPT...) -> backend
	handle /.well-known/oauth-* {
		reverse_proxy {$BACKEND_URL:http://127.0.0.1:8000}
	}
	handle /.well-known/openid-configuration {
		reverse_proxy {$BACKEND_URL:http://127.0.0.1:8000}
	}

	# SPA: unknown paths fall back to index.html
	handle {
		try_files {path} /index.html
		header /assets/* Cache-Control "public, max-age=31536000, immutable"
		file_server
	}
}
