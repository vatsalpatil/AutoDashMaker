# Dokploy service "frontend": Build Type = Nixpacks, Base Directory = /frontend
# Builds the Vite app, then Caddy serves dist/ and proxies /api to the backend (same origin, no CORS).
#
# Fast, reliable builds: Caddy is installed in the SAME setup step as Node, so Nixpacks downloads ONE nixpkgs archive.
# The Caddy config is named caddy.conf (not "Caddyfile") on purpose: a file called Caddyfile makes Nixpacks add its own
# Caddy phase, which pulls a second, separate nixpkgs archive from GitHub (that download is what used to hang deploys).
[variables]
NIXPACKS_NODE_VERSION = "22"
# The Node provider also adds its own "caddy" phase for single-page apps (separate nixpkgs download + /assets/Caddyfile).
# We serve with our own caddy.conf, so turn that automatic phase off.
NIXPACKS_SPA_CADDY = "false"
NIXPACKS_NO_SPA = "true"

[phases.setup]
nixPkgs = ["...", "caddy"]          # "..." keeps the Node provider's packages (nodejs_22, npm)

[phases.install]
cmds = ["npm ci --no-audit --no-fund --prefer-offline"]
cacheDirectories = ["/root/.npm"]   # npm download cache survives between deploys

[phases.build]
cmds = ["npm run build"]
cacheDirectories = ["node_modules/.vite"]

[start]
cmd = "caddy run --config caddy.conf --adapter caddyfile"
