# Dokploy service "frontend": Build Type = Nixpacks, Base Directory = /frontend
# Builds the Vite app, then Caddy serves dist/ and proxies /api to the backend (same origin, no CORS).
[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["...", "caddy"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "caddy run --config Caddyfile --adapter caddyfile"
